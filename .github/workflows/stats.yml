name: Refresh stats card

on:
  schedule:
    - cron: "13 3 * * 0"   # Sundays 03:13 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_stats_svg.py'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python build_stats_svg.py --user AnteurAbderraouf

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh stats card"
            git push
          fi
